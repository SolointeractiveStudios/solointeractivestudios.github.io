<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1a1a2e, #0f1626 60%, #050810);
      color: #f7f7ff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      background: rgba(10, 18, 44, 0.85);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p {
      margin: 0 0 2rem;
      font-size: 1rem;
      color: #cfd8ff;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(80px, 1fr));
      gap: 1rem;
      font-size: 1.5rem;
    }

    .countdown div {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 15px;
      padding: 1rem 0.5rem;
    }

    .countdown span {
      display: block;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      color: #ffffff;
    }

    .label {
      font-size: 0.85rem;
      color: #a7b0ff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Coming Soon</h1>
    <p>Our site launches on March 24, 2028 at 11:59 PM. Stay tuned.</p>
    <div class="countdown" id="countdown">
      <div><span id="days">0</span><div class="label">Days</div></div>
      <div><span id="hours">0</span><div class="label">Hours</div></div>
      <div><span id="minutes">0</span><div class="label">Minutes</div></div>
      <div><span id="seconds">0</span><div class="label">Seconds</div></div>
    </div>
  </div>
  <script>
    const targetDate = new Date('2028-03-24T23:59:00');
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;
      if (diff <= 0) {
        daysEl.textContent = '0';
        hoursEl.textContent = '0';
        minutesEl.textContent = '0';
        secondsEl.textContent = '0';
        clearInterval(timer);
        return;
      }
      const seconds = Math.floor((diff / 1000) % 60);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));

      daysEl.textContent = days;
      hoursEl.textContent = hours.toString().padStart(2, '0');
      minutesEl.textContent = minutes.toString().padStart(2, '0');
      secondsEl.textContent = seconds.toString().padStart(2, '0');
    }

    updateCountdown();
    const timer = setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
